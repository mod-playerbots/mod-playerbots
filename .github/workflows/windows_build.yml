name: windows-build
on:
  push:
    branches: [ "master", "test-staging" ]
  pull_request:
    branches: [ "master", "test-staging" ]

concurrency:
  group: "windows-build-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  windows-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    env:
      BOOST_ROOT: C:\local\boost_1_82_0

    steps:
      - name: Checkout AzerothCore
        uses: actions/checkout@v3
        with:
          repository: 'mod-playerbots/azerothcore-wotlk'
          ref: ${{ (github.base_ref || github.ref_name) == 'test-staging' && 'test-staging' || 'Playerbot' }}
          path: 'ac'

      - name: Checkout Playerbot Module
        uses: actions/checkout@v3
        with:
          repository: 'mod-playerbots/mod-playerbots'
          path: ac/modules/mod-playerbots

      - name: Install Ninja
        shell: powershell
        run: |
          choco install ninja -y

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.13

      - name: Configure OS
        shell: powershell
        working-directory: ac
        env:
          CONTINUOUS_INTEGRATION: true
        run: |
          bash ./acore.sh install-deps

      - name: Build (Ninja)
        shell: powershell
        working-directory: ac
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          $vcvars = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if (-Not (Test-Path $vcvars)) {
            $vcvars = "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          }
          if (-Not (Test-Path $vcvars)) {
            Write-Error "vcvars64.bat not found. Ensure Visual Studio 2022 is installed on the runner."
            exit 1
          }

          # Run vcvars in cmd and capture the environment, then import into PowerShell env
          $envLines = cmd.exe /c "`"$vcvars`" && set"
          foreach ($line in $envLines) {
            if ($line -match "^(.*?)=(.*)$") {
              $name = $matches[1]
              $value = $matches[2]
              # Avoid overwriting PATH entirely; append if PATH variable
              if ($name -eq "PATH") {
                $env:PATH = $value
              } else {
                $env:$name = $value
              }
            }
          }

          # Set build-specific env and run acore.sh under bash (inherits MSVC env)
          $env:CTOOLS_BUILD = "all"
          $env:CMAKE_GENERATOR = "Ninja"
          bash -lc "./acore.sh compiler build"


