name: windows-build

on:
  push:
    branches: [ "master", "test-staging" ]
  pull_request:
    branches: [ "master", "test-staging" ]

concurrency:
  group: "windows-build-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  windows-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}

    env:
      BOOST_ROOT: C:\local\boost_1_82_0
      CMAKE_GENERATOR: Ninja
      CTOOLS_BUILD: all

    steps:
      - name: Checkout AzerothCore
        uses: actions/checkout@v3
        with:
          repository: 'mod-playerbots/azerothcore-wotlk'
          ref: ${{ (github.base_ref || github.ref_name) == 'test-staging' && 'test-staging' || 'Playerbot' }}
          path: a

      - name: Checkout Playerbot Module
        uses: actions/checkout@v3
        with:
          repository: 'mod-playerbots/mod-playerbots'
          path: a/modules/mod-playerbots

      - name: Install Ninja
        shell: powershell
        run: |
          choco install ninja -y

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.13

      - name: Configure OS
        shell: bash
        working-directory: a
        env:
          CONTINUOUS_INTEGRATION: true
        run: |
          ./acore.sh install-deps

      - name: Build
        shell: bash
        working-directory: a
        run: |
          export CTOOLS_BUILD=all
          export CMAKE_GENERATOR=Ninja
          cmake --version
          ninja --version
          echo "CMAKE_GENERATOR=$CMAKE_GENERATOR"
          ./acore.sh compiler build
