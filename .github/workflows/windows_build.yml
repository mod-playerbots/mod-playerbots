name: windows-build

on:
  push:
    branches: [ "master", "test-staging" ]
  pull_request:
    branches: [ "master", "test-staging" ]

concurrency:
  group: "windows-build-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  windows-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}

    env:
      BOOST_ROOT: C:\local\boost_1_87_0
      CMAKE_GENERATOR: Ninja
      CTOOLS_BUILD: all

    steps:
      - name: Checkout AzerothCore
        uses: actions/checkout@v4
        with:
          repository: 'mod-playerbots/azerothcore-wotlk'
          ref: ${{ (github.base_ref || github.ref_name) == 'test-staging' && 'test-staging' || 'Playerbot' }}
          path: a

      - name: Checkout Playerbot Module
        uses: actions/checkout@v4
        with:
          repository: 'mod-playerbots/mod-playerbots'
          path: a/modules/mod-playerbots

      - name: Move source tree to short path
        shell: powershell
        run: |
          if (Test-Path C:\ac) {
            Remove-Item C:\ac -Recurse -Force
          }

          New-Item -ItemType Directory -Path C:\ac | Out-Null

          $log = Join-Path $env:TEMP "robocopy.log"

          # Robocopy silent with multithread, no per-file output, write full log outside destination
          robocopy "${{ github.workspace }}\a" "C:\ac" /MIR /MT:16 /R:1 /W:1 /NFL /NDL /NJH /NJS /NP /LOG:$log
          $rc = $LASTEXITCODE

          # Show only the summary (last lines) to keep the job log clean
          if (Test-Path $log) {
            Write-Host "Robocopy log: $log"
            Get-Content $log -Tail 20
          }

          # robocopy exit codes: 0-7 are success/acceptable, >=8 is failure
          if ($rc -le 7) {
            exit 0
          }
          Write-Error "robocopy failed with exit code $rc. See $log for details."
          exit $rc

      - name: Install Ninja
        shell: powershell
        run: |
          choco install ninja -y

      - name: Install vcpkg and Boost via vcpkg
        shell: powershell
        run: |
          if (-Not (Test-Path C:\vcpkg)) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          } else {
            Write-Host "vcpkg already present"
          }

          & C:\vcpkg\bootstrap-vcpkg.bat

          # Install only required Boost components for AzerothCore (x64)
          C:\vcpkg\vcpkg.exe install boost-filesystem:x64-windows boost-program-options:x64-windows boost-iostreams:x64-windows boost-regex:x64-windows boost-thread:x64-windows --recurse

          # Export vcpkg variables for subsequent steps
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.13

      - name: Configure OS (run acore.sh install-deps but tolerate failures)
        shell: bash
        working-directory: C:\ac
        env:
          CONTINUOUS_INTEGRATION: true
          VCPKG_ROOT: C:\vcpkg
          CMAKE_TOOLCHAIN_FILE: C:\vcpkg\scripts\buildsystems\vcpkg.cmake
        run: |
          ./acore.sh install-deps || echo "acore.sh install-deps failed or partially failed; continuing"

      - name: Ensure MySQL client is available
        shell: powershell
        run: |
          refreshenv

          if (Get-Command mysql -ErrorAction SilentlyContinue) {
            Write-Host "mysql client already present"
            exit 0
          }

          Write-Host "Attempting to install mysql via Chocolatey..."
          choco install mysql -y --no-progress

          if (Get-Command mysql -ErrorAction SilentlyContinue) {
            Write-Host "mysql installed successfully"
            exit 0
          }

          Write-Error "mysql client could not be installed via Chocolatey. Failing the job."
          exit 1

      - name: Create AzerothCore CI config
        shell: bash
        working-directory: C:\ac
        env:
          VCPKG_ROOT: C:\vcpkg
          CMAKE_TOOLCHAIN_FILE: C:\vcpkg\scripts\buildsystems\vcpkg.cmake
        run: |
          cat > conf/config.sh <<'EOF'
          CCOMPILERC="cl"
          CCOMPILERCXX="cl"

          CTYPE="Release"
          CSCRIPTS="static"
          CMODULES="static"
          CTOOLS_BUILD="all"

          CCUSTOMOPTIONS="-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_RC_COMPILER=rc -DCMAKE_NINJA_FORCE_RESPONSE_FILE=ON -DCMAKE_NINJA_CMCLDEPS_RC=OFF -DCMAKE_C_USE_RESPONSE_FILE_FOR_OBJECTS=ON -DCMAKE_CXX_USE_RESPONSE_FILE_FOR_OBJECTS=ON -DCMAKE_C_USE_RESPONSE_FILE_FOR_INCLUDES=ON -DCMAKE_CXX_USE_RESPONSE_FILE_FOR_INCLUDES=ON -DCMAKE_C_USE_RESPONSE_FILE_FOR_LIBRARIES=ON -DCMAKE_CXX_USE_RESPONSE_FILE_FOR_LIBRARIES=ON"
          EOF

          cat conf/config.sh

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - name: Build (Ninja + MSVC + vcpkg)
        shell: bash
        working-directory: C:\ac
        env:
          CTOOLS_BUILD: all
          CMAKE_GENERATOR: Ninja
          CC: cl
          CXX: cl
          RC: rc
          VCPKG_ROOT: C:\vcpkg
          CMAKE_TOOLCHAIN_FILE: C:\vcpkg\scripts\buildsystems\vcpkg.cmake
        run: |
          # show versions and environment sanity checks
          cmake --version
          ninja --version

          echo "CMAKE_GENERATOR=$CMAKE_GENERATOR"
          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "VCPKG_ROOT=$VCPKG_ROOT"
          echo "CMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE"

          which cl || true
          which rc || true
          cl || true
          rc || true

          # ensure a clean build directory
          rm -rf var/build/obj || true

          # run the AzerothCore build script (acore.sh reads CMAKE_TOOLCHAIN_FILE and CMAKE_GENERATOR)
          ./acore.sh compiler build
