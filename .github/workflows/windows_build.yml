name: windows-build

'on':
  push:
    branches: [ "master", "test-staging" ]
  pull_request:
    branches: [ "master", "test-staging" ]

concurrency:
  group: "windows-build-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  windows-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}

    env:
      CMAKE_GENERATOR: Ninja
      CTOOLS_BUILD: all
      VCPKG_ROOT: C:\vcpkg
      CMAKE_TOOLCHAIN_FILE: C:\vcpkg\scripts\buildsystems\vcpkg.cmake

    steps:
      - name: Checkout AzerothCore
        uses: actions/checkout@v4
        with:
          repository: 'mod-playerbots/azerothcore-wotlk'
          ref: ${{ (github.base_ref || github.ref_name) == 'test-staging' && 'test-staging' || 'Playerbot' }}
          path: a

      - name: Checkout Playerbot Module
        uses: actions/checkout@v4
        with:
          repository: 'mod-playerbots/mod-playerbots'
          path: a/modules/mod-playerbots

      - name: Move source tree to short path
        shell: powershell
        run: |
          if (Test-Path C:\ac) {
            Remove-Item C:\ac -Recurse -Force
          }

          New-Item -ItemType Directory -Path C:\ac | Out-Null

          $log = Join-Path $env:TEMP "robocopy.log"

          robocopy "${{ github.workspace }}\a" "C:\ac" /MIR /MT:16 /R:1 /W:1 /NFL /NDL /NJH /NJS /NP /LOG:$log
          $rc = $LASTEXITCODE

          if (Test-Path $log) {
            Write-Host "Robocopy log: $log"
            Get-Content $log -Tail 20
          }

          if ($rc -le 7) {
            exit 0
          }

          Write-Error "robocopy failed with exit code $rc. See $log for details."
          exit $rc

      - name: Install Ninja
        shell: powershell
        run: |
          choco install ninja -y --no-progress

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\buildtrees
            C:\vcpkg\downloads
          key: vcpkg-${{ runner.os }}-boost-${{ hashFiles('a/**/*.cmake', 'a/**/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-boost-

      - name: Install Boost with vcpkg
        shell: powershell
        run: |
          if (-Not (Test-Path C:\vcpkg\vcpkg.exe)) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat
          }

          C:\vcpkg\vcpkg.exe install `
            boost-filesystem:x64-windows `
            boost-program-options:x64-windows `
            boost-iostreams:x64-windows `
            boost-regex:x64-windows `
            boost-thread:x64-windows `
            --recurse

          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Configure OS dependencies
        shell: bash
        working-directory: C:\ac
        env:
          CONTINUOUS_INTEGRATION: true
          VCPKG_ROOT: C:\vcpkg
          CMAKE_TOOLCHAIN_FILE: C:\vcpkg\scripts\buildsystems\vcpkg.cmake
        run: |
          ./acore.sh install-deps || echo "acore.sh install-deps failed or partially failed; continuing"

      - name: Ensure MySQL client is installed
        shell: powershell
        run: |
          refreshenv

          if (Get-Command mysql -ErrorAction SilentlyContinue) {
            Write-Host "mysql client already present"
            exit 0
          }

          Write-Host "Installing mysql via Chocolatey..."
          choco install mysql -y --no-progress

          refreshenv

          if (Get-Command mysql -ErrorAction SilentlyContinue) {
            Write-Host "mysql installed successfully"
            exit 0
          }

          Write-Error "mysql client could not be installed via Chocolatey."
          exit 1

      - name: Create AzerothCore CI config
        shell: bash
        working-directory: C:\ac
        run: |
          cat > conf/config.sh <<'EOF'
          CCOMPILERC="cl"
          CCOMPILERCXX="cl"

          CTYPE="Release"
          CSCRIPTS="static"
          CMODULES="static"
          CTOOLS_BUILD="all"

          CCUSTOMOPTIONS="-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_RC_COMPILER=rc -DCMAKE_NINJA_FORCE_RESPONSE_FILE=ON -DCMAKE_NINJA_CMCLDEPS_RC=OFF -DCMAKE_C_USE_RESPONSE_FILE_FOR_OBJECTS=ON -DCMAKE_CXX_USE_RESPONSE_FILE_FOR_OBJECTS=ON -DCMAKE_C_USE_RESPONSE_FILE_FOR_INCLUDES=ON -DCMAKE_CXX_USE_RESPONSE_FILE_FOR_INCLUDES=ON -DCMAKE_C_USE_RESPONSE_FILE_FOR_LIBRARIES=ON -DCMAKE_CXX_USE_RESPONSE_FILE_FOR_LIBRARIES=ON"
          EOF

          cat conf/config.sh

      - name: Build
        shell: bash
        working-directory: C:\ac
        env:
          CTOOLS_BUILD: all
          CMAKE_GENERATOR: Ninja
          CC: cl
          CXX: cl
          RC: rc
          VCPKG_ROOT: C:\vcpkg
          CMAKE_TOOLCHAIN_FILE: C:\vcpkg\scripts\buildsystems\vcpkg.cmake
        run: |
          cmake --version
          ninja --version

          echo "CMAKE_GENERATOR=$CMAKE_GENERATOR"
          echo "VCPKG_ROOT=$VCPKG_ROOT"
          echo "CMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE"
          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "RC=$RC"

          which cl || true
          which rc || true
          cl || true
          rc || true

          echo "=== Installed vcpkg packages ==="
          /c/vcpkg/vcpkg.exe list || true

          echo "=== Check Boost headers ==="
          test -f /c/vcpkg/installed/x64-windows/include/boost/version.hpp
          test -f /c/vcpkg/installed/x64-windows/include/boost/filesystem.hpp
          test -f /c/vcpkg/installed/x64-windows/include/boost/asio.hpp

          rm -rf var/build/obj

          ./acore.sh compiler build
