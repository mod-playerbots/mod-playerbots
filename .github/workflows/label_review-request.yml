name: Label review requests

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  label-review-request:
    runs-on: ubuntu-latest
    steps:
      # Reads the PR body through the event payload only. No checkout and no shell
      # interpolation of the body, so pull_request_target is safe here.
      - name: Sync "Review requested" label with template checkbox
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'Review requested';
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const wants = /^\s*-\s*\[[xX]\]\s*I could not run a review/m.test(body);
            const has = pr.labels.some(l => l.name === label);
            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number };

            if (wants && !has)
                await github.rest.issues.addLabels({ ...issue, labels: [label] });
            else if (!wants && has)
                await github.rest.issues.removeLabel({ ...issue, name: label });
